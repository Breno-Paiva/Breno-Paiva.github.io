<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 • BRENO PAIVA</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="shortcut icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=VT323" rel="stylesheet">
  </head>
  <body>
    <section class="not-found">
      <img src="/images/astonaught.png" alt="Astronaut illustration">
      <h1 class="text-header">404</h1>
      <h1 class="text-header" style="font-size: 32px; letter-spacing: 4px;">Lost in space</h1>
      <div class="arrow">
        <a href="/">Back to BRENO PAIVA</a>
      </div>
    </section>
    <script>
      // GitHub Pages routes /RepoName case-sensitively, so a typo'd or
      // differently-cased visit to a project (wordji, WORDJI, word, ...)
      // lands here instead of the live page. Catch that here and bounce to
      // the correct project instead of showing 404.
      //
      // To add a project once it goes live, add its repo name below.
      var PROJECTS = ["Wordji", "FunkyDancer", "Codji"];

      (function redirectToProjectIfKnown() {
        var segments = window.location.pathname.split("/").filter(Boolean);
        if (segments.length === 0) return;

        var normalize = function (s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ""); };
        var requested = normalize(segments[0]);
        if (requested.length < 4) return; // avoid matching on very short/ambiguous typos

        var match = PROJECTS.find(function (name) {
          var canonical = normalize(name);
          return canonical.indexOf(requested) === 0 || requested.indexOf(canonical) === 0;
        });
        if (!match) return;

        var rest = segments.slice(1).join("/");
        var target = "/" + match + "/" + rest + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
